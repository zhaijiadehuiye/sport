<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#87918f"/>
      <stop offset=".56" stop-color="#6f7a78"/>
      <stop offset="1" stop-color="#4e5a59"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a45e"/>
      <stop offset=".36" stop-color="#c98d48"/>
      <stop offset="1" stop-color="#9b602f"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce7d4"/>
      <stop offset="1" stop-color="#8da69d"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9d4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff9d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="wallTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .1"/></feComponentTransfer>
    </filter>
    <filter id="woodTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .16" numOctaves="2" seed="14"/>
      <feColorMatrix type="matrix" values=".45 0 0 0 .26 .25 0 0 0 .12 .12 0 0 0 .06 0 0 0 .22 0"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="boards" width="170" height="18" patternUnits="userSpaceOnUse">
      <rect width="170" height="18" fill="none"/>
      <path d="M0 3h170M0 12h170" stroke="#7c4c29" stroke-opacity=".12" stroke-width="1"/>
      <path d="M14 0v18M106 0v18" stroke="#f5c47c" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="560" fill="#243032" opacity=".16" filter="url(#wallTexture)"/>

